[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voclyp"
version = "0.1.0"
description = "VoClyp — field-conversation-to-insight platform (pipeline of swappable stages behind three stable contracts)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gateway = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart"]
security = ["cryptography>=42"]  # audio encryption at rest (AudioVault)

[tool.setuptools.packages.find]
include = ["voclyp*"]
